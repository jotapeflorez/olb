name: Actualizar catálogo

on:
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions
  schedule:
    - cron: '0 3 * * *' # Se ejecuta automáticamente todos los días a las 3:00 AM UTC

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Ejecutar script de actualización
        run: python armar_catalogo_auto.py

      - name: Generar feed público controlado
        run: python generar_feed_publico.py

      - name: Verificar feed antes de publicarlo
        run: python verificar_feed_publico.py

      - name: Guardar cambios en el repositorio
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "Actualización automática del catálogo" || exit 0
          git push
