name: Preparar actualización diaria del catálogo

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'

permissions:
  contents: read

concurrency:
  group: propuesta-catalogo
  cancel-in-progress: false

jobs:
  preparar:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    outputs:
      cloudflare_configurado: ${{ steps.credenciales.outputs.configurado }}
    steps:
      - name: Obtener versión publicada sin credenciales de escritura
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Consultar catálogos
        run: python armar_catalogo_auto.py
      - name: Generar feed público
        run: python generar_feed_publico.py
      - name: Generar fichas
        run: python generar_fichas.py
      - name: Generar feed operativo
        run: python generar_feed_olb_os.py
      - name: Validar fichas y descartar caídas de las fuentes
        run: |
          python verificar_feed_publico.py
          python validar_actualizacion_diaria.py
      - name: Guardar datos validados para publicación controlada
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: catalogo-validado
          path: |
            productos.json
            fuentes_oficiales.json
            catalogo_meta.json
            datos_catalogo.js
            feed/
            p/
          if-no-files-found: error
          retention-days: 7

      - name: Comprobar si Cloudflare está configurado
        id: credenciales
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OLB_PUBLICACION_DIARIA: ${{ vars.OLB_PUBLICACION_DIARIA }}
        run: |
          if [ "$OLB_PUBLICACION_DIARIA" = 'SI' ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'configurado=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configurado=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Catálogo validado. Faltan variable de activación o credenciales de Pages; no se despliega.'
          fi

  publicar_cloudflare:
    if: github.ref == 'refs/heads/main' && needs.preparar.outputs.cloudflare_configurado == 'true'
    needs: preparar
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Obtener código del sitio sin credenciales de escritura
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Recuperar datos validados
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: catalogo-validado
          path: ${{ runner.temp }}/catalogo-validado

      - name: Construir únicamente archivos públicos
        env:
          CATALOGO_VALIDADO: ${{ runner.temp }}/catalogo-validado
        run: python construir_publico.py "$CATALOGO_VALIDADO" dist

      - name: Desplegar en el proyecto Pages existente
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.136.3'
          command: pages deploy dist --project-name=olbsanpedro --branch=main

      - name: Desactivar despliegues Git que exponen archivos internos
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python controlar_pages.py

      - name: Confirmar fecha visible en el sitio
        env:
          OLB_FEED_META: dist/feed/catalogo_publico_meta.json
        run: python verificar_sitio_publico.py
